version = 1

[[apps]]
name = "sol-arb"
command = "/usr/bin/env bun run start"
cwd = "/home/mdev/Programming/sol_arb_flashloan"
restart_policy = "always"
max_restarts = 1000
crash_restart_limit = 0
restart_delay_secs = 5
stop_signal = "SIGTERM"
stop_timeout_secs = 20
health_cmd = "/usr/bin/test -f /home/mdev/Programming/sol_arb_flashloan/bot.log && /usr/bin/test $(( $(date +%s) - $(stat -c %Y /home/mdev/Programming/sol_arb_flashloan/bot.log) )) -lt 60"
health_interval_secs = 60
health_timeout_secs = 5
health_max_failures = 3

[apps.env]
PATH = "/home/mdev/.cargo/bin:/usr/local/bin:/home/mdev/.local/bin:/usr/bin:/bin:/home/mdev/.bun/bin"
HOME = "/home/mdev"
NODE_ENV = "production"
